<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>HD Onboarding - Linear View</title>
  <style>
    :root{
      --primary:#2563eb;
      --secondary:#64748b;
      --bg:#f1f5f9;
      --card-bg:#ffffff;
      --border:#cbd5e1;

      --leader-color:#dc2626;
      --gen-color:#2563eb;
      --doc-color:#059669;

      --column-even:#f8fafc;
      --column-odd:#ffffff;

      /* Connector */
      --line:#94a3b8;
      --line-soft:rgba(148,163,184,.45);

      /* Marker */
      --day1:#f08200;
    }

    body{
      font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
      background:var(--bg);
      margin:0;
      color:#1e293b;
      height:100vh;
      display:flex;
      flex-direction:column;
    }

    /* Top Bar */
    .top-bar{
      background:#fff;
      padding:15px 30px;
      border-bottom:1px solid var(--border);
      display:flex;
      justify-content:space-between;
      align-items:center;
      z-index:100;
      box-shadow:0 2px 4px rgba(0,0,0,.05);
      gap:16px;
    }
    .top-bar h3{ margin:0; font-size:16px; }
    .controls{ display:flex; gap:10px; flex-wrap:wrap; }

    button{
      padding:8px 16px;
      border:1px solid var(--border);
      background:#fff;
      border-radius:8px;
      cursor:pointer;
      font-weight:600;
      color:var(--secondary);
      transition:all .2s;
    }
    button:hover{ background:#f8fafc; border-color:var(--primary); }
    button.active{
      background:var(--primary);
      color:#fff;
      border-color:var(--primary);
    }

    /* Main Diagram Area */
    .diagram-wrapper{
      flex:1;
      overflow:auto;
      position:relative;
      background:var(--bg);
    }

    .grid-container{
      display:grid;
      grid-template-columns:repeat(8, minmax(220px, 1fr));
      min-width:1760px;
      min-height:100%;
      position:relative;
    }

    /* Column Styles */
    .time-column{
      border-right:1px dashed var(--border);
      padding:20px;
      position:relative;
      display:flex;
      flex-direction:column;
      gap:18px;              /* tighter + cleaner */
      padding-top:64px;      /* header space */
    }
    .time-column:nth-child(even){ background:var(--column-even); }
    .time-column:nth-child(odd){ background:var(--column-odd); }

    .col-header{
      position:absolute;
      top:0; left:0;
      width:100%;
      text-align:center;
      padding:14px 0;
      font-weight:800;
      text-transform:uppercase;
      letter-spacing:.6px;
      font-size:.78rem;
      color:var(--secondary);
      background:rgba(255,255,255,.92);
      border-bottom:1px solid var(--border);
      z-index:10;
      backdrop-filter:saturate(1.2) blur(3px);
    }

    /* Day 1 vertical marker */
    .day1-marker{
      position:absolute;
      top:0;
      bottom:0;
      width:0;
      border-left:3px solid rgba(240,130,0,.55);
      pointer-events:none;
      z-index:9;
    }
    .day1-pill{
      position:absolute;
      top:10px;
      transform:translateX(-50%);
      background:rgba(240,130,0,.12);
      border:1px solid rgba(240,130,0,.35);
      color:#9a4d00;
      font-weight:800;
      font-size:11px;
      padding:6px 10px;
      border-radius:999px;
      letter-spacing:.5px;
      pointer-events:none;
      z-index:11;
      white-space:nowrap;
    }

    /* Cards */
    .card{
      background:var(--card-bg);
      border:1px solid var(--border);
      border-radius:10px;
      padding:14px 14px 12px;
      position:relative;
      z-index:20;
      cursor:pointer;
      transition:transform .18s, box-shadow .18s, border-color .18s;
      box-shadow:0 2px 4px rgba(0,0,0,.05);
    }
    .card:hover{
      transform:translateY(-2px);
      box-shadow:0 10px 18px rgba(0,0,0,.10);
      border-color:rgba(37,99,235,.55);
    }

    /* IMPORTANT: leader type was "leader" in data; keep class for that */
    .card.leader{ border-top:4px solid var(--leader-color); }
    .card.general{ border-top:4px solid var(--gen-color); }
    .card.docs{ border-top:4px solid var(--doc-color); }

    .card h4{ margin:0 0 6px 0; font-size:.95rem; line-height:1.2; }
    .card p{ margin:0; font-size:.82rem; color:var(--secondary); line-height:1.25; }

    /* Small tag (optional) */
    .tag{
      position:absolute;
      right:10px;
      top:10px;
      font-size:10px;
      letter-spacing:.35px;
      font-weight:800;
      color:rgba(30,41,59,.70);
      background:rgba(15,23,42,.04);
      border:1px solid rgba(15,23,42,.10);
      padding:4px 8px;
      border-radius:999px;
      text-transform:uppercase;
    }

    /* SVG Overlay for Lines */
    #svg-layer{
      position:absolute;
      top:0;
      left:0;
      /* width/height set via JS to match scroll size */
      pointer-events:none;
      z-index:15;
    }
    .link{
      stroke:var(--line);
      stroke-width:1.4;         /* thinner */
      fill:none;
      marker-end:url(#arrow);
      opacity:.95;
    }
    .link-shadow{
      stroke:var(--line-soft);
      stroke-width:4.2;         /* soft shadow under line */
      fill:none;
      opacity:.35;
    }

    /* Modal */
    .modal-overlay{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.5);
      display:none;
      justify-content:center;
      align-items:center;
      z-index:200;
      padding:16px;
    }
    .modal{
      background:#fff;
      padding:26px;
      border-radius:14px;
      width:560px;
      max-width:100%;
      box-shadow:0 20px 25px -5px rgba(0,0,0,.18);
    }
    .modal-header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:16px;
      border-bottom:1px solid var(--border);
      padding-bottom:10px;
      gap:12px;
    }
    .modal-header h2{ margin:0; font-size:1.25rem; line-height:1.2; }
    .close-btn{
      background:none;
      border:none;
      font-size:1.6rem;
      cursor:pointer;
      color:var(--secondary);
      padding:0 6px;
      line-height:1;
    }
    .modal-body h5{
      margin:14px 0 6px;
      color:var(--secondary);
      text-transform:uppercase;
      font-size:.72rem;
      letter-spacing:.5px;
    }
    .modal-body p{ margin:0; line-height:1.6; }

    @media (max-width:720px){
      .top-bar{ padding:12px 14px; }
      .grid-container{ min-width:1500px; }
    }
  </style>
</head>

<body>
  <div class="top-bar">
    <h3>HD Onboarding Process</h3>
    <div class="controls">
      <button type="button" onclick="setPersona('general')" id="btn-gen">General Employee</button>
      <button type="button" onclick="setPersona('new_leader')" id="btn-new" class="active">New Leader</button>
      <button type="button" onclick="setPersona('promo_leader')" id="btn-promo">Promoted Leader</button>
    </div>
  </div>

  <div class="diagram-wrapper" id="wrapper">
    <div class="grid-container" id="grid"></div>
    <svg id="svg-layer" aria-hidden="true"></svg>
  </div>

  <div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h2 id="modal-title">Step Title</h2>
        <button class="close-btn" aria-label="Close" onclick="closeModal()">×</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <script>
    // --- DATA ---
    const phases = ["Trigger","Day 1","Week 1","Week 2","30 Days","45 Days","60 Days","90 Days"];

    const steps = [
      { id:'trig', title:"Offer Accepted", desc:"Candidate accepts via portal", phase:0, type:'general', roles:['all'],
        context:"Trigger event. HR receives notification. Integrations fire to create user profile.", connectTo:['doc_req','welc'] },

      { id:'doc_req', title:"Request Docs", desc:"Automated checklist sent", phase:0, type:'docs', roles:['all'],
        context:"System sends email to candidate requesting: ID, Proof of Address, Bank Info, Tax ID.", connectTo:['sign'] },

      { id:'welc', title:"General Welcome", desc:"Reception & IT handoff", phase:1, type:'general', roles:['all'],
        context:"Candidate arrives. Reception provides badge. IT provides laptop and credentials.", connectTo:['train'] },

      { id:'sign', title:"Sign Contract", desc:"Legal Team", phase:1, type:'docs', roles:['all'],
        context:"Physical or digital signature of the employment contract. Validated by Legal.", connectTo:[] },

      { id:'comm_gen', title:"Entry Announcement", desc:"Standard comms", phase:1, type:'general', roles:['general'],
        context:"HR sends a 'New Joiner' email to the immediate team and department.", connectTo:['train'] },

      { id:'comm_lead', title:"Leadership Announcement", desc:"Org-wide comms", phase:1, type:'leader', roles:['new_leader'],
        context:"HR/VP sends an organization-wide email introducing the new leader.", connectTo:['go_day'] },

      { id:'comm_promo', title:"Promotion Announcement", desc:"Internal comms", phase:1, type:'leader', roles:['promo_leader'],
        context:"Announcement of internal promotion sent to the company.", connectTo:['go_day'] },

      { id:'train', title:"Core Training", desc:"LMS modules", phase:2, type:'general', roles:['all'],
        context:"Mandatory modules: Compliance, Data Security, Code of Conduct.", connectTo:['intro'] },

      { id:'intro', title:"Team Introductions", desc:"1:1 meetings", phase:3, type:'general', roles:['all'],
        context:"Scheduled 1:1s with immediate team members and key cross-functional partners.", connectTo:[] },

      { id:'go_day', title:"Go Day Plan", desc:"Create 30-day strategy", phase:4, type:'leader', roles:['new_leader','promo_leader'],
        context:"<b>Leader Only:</b> Create a structured plan for the first 30 days.<br><b>Deliverable:</b> Draft reviewed with manager.", connectTo:['rev_60'] },

      { id:'rev_30', title:"30-Day Check", desc:"HRBP check-in", phase:4, type:'general', roles:['general'],
        context:"Casual check-in to confirm tools access and culture integration.", connectTo:[] },

      { id:'rev_60', title:"60-Day Review", desc:"Plan execution check", phase:6, type:'leader', roles:['new_leader','promo_leader'],
        context:"Review progress against the Go Day Plan. Adjust priorities if needed.", connectTo:['final_90'] },

      { id:'final_90', title:"90-Day Deliverables", desc:"MBOs & SWOT", phase:7, type:'leader', roles:['new_leader','promo_leader'],
        context:"<b>Final Output:</b><br>- Full Action Plan<br>- MBOs defined<br>- SWOT Analysis<br>- Team Diagnostic", connectTo:[] },

      { id:'probation', title:"Probation Review", desc:"Confirm employment", phase:7, type:'general', roles:['general'],
        context:"Formal review to confirm end of probation period.", connectTo:[] }
    ];

    let currentRole = 'new_leader';

    // --- RENDER ---
    function init(){
      setPersona('new_leader');
      const wrapper = document.getElementById('wrapper');
      wrapper.addEventListener('scroll', () => drawLines(), { passive:true }); // IMPORTANT: redraw on scroll
      window.addEventListener('resize', () => drawLines());
      document.addEventListener('keydown', (e)=>{
        if(e.key === 'Escape') closeModal();
      });
    }

    function setPersona(role){
      currentRole = role;
      document.querySelectorAll('.controls button').forEach(b => b.classList.remove('active'));
      if(role === 'general') document.getElementById('btn-gen').classList.add('active');
      if(role === 'new_leader') document.getElementById('btn-new').classList.add('active');
      if(role === 'promo_leader') document.getElementById('btn-promo').classList.add('active');
      render();
    }

    function render(){
      const container = document.getElementById('grid');
      container.innerHTML = '';

      // Add Day 1 marker (inside the scroll area)
      // Marker sits at the left edge of the Day 1 column.
      const day1Marker = document.createElement('div');
      day1Marker.className = 'day1-marker';
      container.appendChild(day1Marker);

      const day1Pill = document.createElement('div');
      day1Pill.className = 'day1-pill';
      day1Pill.textContent = 'DAY 1 START';
      container.appendChild(day1Pill);

      // Build columns
      const columns = [];
      for(let i=0;i<phases.length;i++){
        const col = document.createElement('div');
        col.className = 'time-column';
        col.innerHTML = `<div class="col-header">${phases[i]}</div>`;
        container.appendChild(col);
        columns.push(col);
      }

      // Filter steps
      const visibleSteps = steps
        .filter(s => s.roles.includes('all') || s.roles.includes(currentRole))
        // keep consistent ordering within a column
        .sort((a,b)=> a.phase - b.phase);

      // Place cards
      visibleSteps.forEach(step=>{
        const card = document.createElement('div');
        card.className = `card ${step.type}`;
        card.id = `card-${step.id}`;
        card.tabIndex = 0; // keyboard focus
        card.innerHTML = `
          <span class="tag">${step.type}</span>
          <h4>${step.title}</h4>
          <p>${step.desc}</p>
        `;
        card.onclick = () => openModal(step);
        card.onkeydown = (e)=>{ if(e.key === 'Enter' || e.key === ' ') openModal(step); };

        columns[step.phase].appendChild(card);
      });

      // Position Day 1 marker based on the Day 1 column offset
      requestAnimationFrame(() => {
        const day1Col = columns[1]; // phase index 1
        const gridRect = container.getBoundingClientRect();
        const day1Rect = day1Col.getBoundingClientRect();

        const left = (day1Rect.left - gridRect.left); // within grid
        day1Marker.style.left = `${left}px`;
        day1Pill.style.left = `${left}px`;

        drawLines(visibleSteps);
      });
    }

    function drawLines(visibleSteps){
      const svg = document.getElementById('svg-layer');
      const grid = document.getElementById('grid');
      const wrapper = document.getElementById('wrapper');

      // Ensure SVG matches scrollable canvas size
      const scrollW = grid.scrollWidth;
      const scrollH = grid.scrollHeight;
      svg.setAttribute('width', scrollW);
      svg.setAttribute('height', scrollH);
      svg.style.width = scrollW + 'px';
      svg.style.height = scrollH + 'px';

      svg.innerHTML = `
        <defs>
          <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
            <path d="M0,0 L0,6 L9,3 z" fill="#94a3b8"></path>
          </marker>
        </defs>
      `;

      // Recompute visible steps if not provided
      if(!visibleSteps){
        visibleSteps = steps.filter(s => s.roles.includes('all') || s.roles.includes(currentRole));
      }

      // Draw
      visibleSteps.forEach(source=>{
        source.connectTo.forEach(targetId=>{
          if(!visibleSteps.find(s=>s.id===targetId)) return;

          const startEl = document.getElementById(`card-${source.id}`);
          const endEl   = document.getElementById(`card-${targetId}`);
          if(startEl && endEl) drawOrthogonal(svg, wrapper, startEl, endEl);
        });
      });
    }

    function drawOrthogonal(svg, wrapper, startEl, endEl){
      const sRect = startEl.getBoundingClientRect();
      const eRect = endEl.getBoundingClientRect();
      const wRect = wrapper.getBoundingClientRect();

      // Convert viewport coords -> wrapper scroll coords
      const x1 = (sRect.right - wRect.left) + wrapper.scrollLeft;
      const y1 = (sRect.top + sRect.height/2 - wRect.top) + wrapper.scrollTop;

      const x2 = (eRect.left - wRect.left) + wrapper.scrollLeft;
      const y2 = (eRect.top + eRect.height/2 - wRect.top) + wrapper.scrollTop;

      const midX = x1 + (x2 - x1) / 2;

      const d = `M ${x1} ${y1} L ${midX} ${y1} L ${midX} ${y2} L ${x2} ${y2}`;

      // soft shadow under the line (cleaner look)
      const shadow = document.createElementNS("http://www.w3.org/2000/svg","path");
      shadow.setAttribute("d", d);
      shadow.setAttribute("class", "link-shadow");
      svg.appendChild(shadow);

      const path = document.createElementNS("http://www.w3.org/2000/svg","path");
      path.setAttribute("d", d);
      path.setAttribute("class", "link");
      svg.appendChild(path);
    }

    // --- MODAL ---
    function openModal(stepData){
      document.getElementById('modal-title').innerText = stepData.title;
      document.getElementById('modal-body').innerHTML = `
        <h5>Description</h5>
        <p>${stepData.context}</p>
        <h5>Timeline</h5>
        <p>${phases[stepData.phase]}</p>
        <h5>Category</h5>
        <p>${stepData.type.toUpperCase()}</p>
      `;
      document.getElementById('modal-overlay').style.display = 'flex';
    }

    function closeModal(e){
      if(e) e.stopPropagation();
      document.getElementById('modal-overlay').style.display = 'none';
    }

    init();
  </script>
</body>
</html>
